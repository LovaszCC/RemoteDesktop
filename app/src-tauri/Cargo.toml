[package]
name = "rd-app"
description = "RemoteDesktop Tauri shell: commands, state, events and menus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "rd_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
base64.workspace = true
dirs.workspace = true
hostname.workspace = true
rd-core.workspace = true
rd-platform.workspace = true
rd-rdp.workspace = true
rd-ssh.workspace = true
rd-store.workspace = true
rd-update.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# ed25519 + getrandom: "Set up SSH key login" generates key pairs.
ssh-key = { workspace = true, features = ["ed25519", "getrandom"] }
# macos-private-api: the transparent, vibrant main window on macOS (tauri.macos.conf.json); a no-op elsewhere.
tauri = { workspace = true, features = ["macos-private-api"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true
tokio.workspace = true
time.workspace = true
tokio-util.workspace = true
zeroize.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
