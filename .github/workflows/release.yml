# Builds the ad-hoc signed app and publishes a DMG.
#   push tag v1.2.3      → GitHub Release "v1.2.3" with RemoteDesktop-1.2.3.dmg (+ .sha256)
#   Run workflow (manual) → dry run: DMG uploaded as a workflow artifact, no release
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install cmake ninja
          # SwiftTerm compiles a Metal shader.
          xcodebuild -downloadComponent MetalToolchain

      # The static FreeRDP build takes ~10 min; reuse it until its script or patches change.
      - name: Cache FreeRDP
        uses: actions/cache@v4
        with:
          path: Vendor/FreeRDP.xcframework
          key: freerdp-${{ runner.arch }}-${{ hashFiles('scripts/build-freerdp.sh', 'patches/freerdp/**') }}

      - name: Build FreeRDP
        run: scripts/build-freerdp.sh

      - name: Test
        run: swift test

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Build app and DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: "-"
        run: |
          scripts/build-app.sh
          scripts/make-dmg.sh

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/RemoteDesktop-"$VERSION".dmg build/RemoteDesktop-"$VERSION".dmg.sha256 \
            --title "RemoteDesktop $VERSION" --generate-notes

      - name: Upload dry-run DMG
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktop-${{ env.VERSION }}
          path: build/RemoteDesktop-*.dmg*
